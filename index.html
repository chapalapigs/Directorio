<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CPP WRLD</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- VERIFY -->
    <div id="verifyScreen" class="screen">

        <div class="verifyBox">

            <input
                id="codeInput"
                type="text"
                placeholder="ENTER CODE"
                autocomplete="off"
                spellcheck="false"
            >

            <button id="verifyButton">
                VERIFY
            </button>

            <div id="errorMessage"></div>

        </div>

    </div>


    <!-- LOADING -->
    <div id="loadingScreen" class="screen hidden">

        <div class="loader"></div>

    </div>


    <!-- RESULT -->
    <div id="resultScreen" class="screen hidden">

        <div class="resultBox">

            <img
                id="productImage"
                src="THE9TH.png"
                alt="THE9TH"
            >

            <h1>THE9TH</h1>

            <div class="line"></div>

            <div id="pieceNumber">1/9</div>

            <div class="verified">
                VERIFIED
            </div>

        </div>

    </div>


    <!-- MUSIC -->
    <audio
        id="godfatherAudio"
        src="El Padrino (Tema Original)The Godfather (Original Theme).mp3"
        preload="auto"
        playsinline
    ></audio>


    <script src="script.js"></script>

</body>
</html>
